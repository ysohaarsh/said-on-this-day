<style>
/* Layout: TV-listings guide. Sticky control strip, then one band per decade (newest first), shows as a dense wrap of tickable rows. */
:root {
  --paper: #f3f4f7;
  --card: #ffffff;
  --ink: #18202e;
  --muted: #5d6677;
  --rule: #d8dce4;
  --signal: #2346b8;
  --signal-soft: #e3e9fb;
  --onair: #c2410c;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11151d; --card: #181e29; --ink: #e7eaf1; --muted: #98a1b3; --rule: #2a3241;
  --signal: #8aa6ff; --signal-soft: #1f2a48; --onair: #fb8a4c; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11151d; --card: #181e29; --ink: #e7eaf1; --muted: #98a1b3; --rule: #2a3241;
  --signal: #8aa6ff; --signal-soft: #1f2a48; --onair: #fb8a4c; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45 }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper) }
header h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6vw, 54px); line-height: 1; letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance }
header p { color: var(--muted); max-width: 62ch; margin: 10px 0 0 }
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 2px solid var(--ink); padding-block: 14px 12px; margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center }
.strip input[type=search] { flex: 1 1 220px; min-width: 0; font: inherit; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--ink) }
.strip input:focus-visible, button:focus-visible, textarea:focus-visible, label:focus-within { outline: 2px solid var(--signal); outline-offset: 2px }
.count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap }
.count b { font-size: 20px; color: var(--signal); font-weight: 500 }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap }
.status.err { color: var(--onair) }
.jump { display: flex; flex-wrap: wrap; gap: 6px; width: 100% }
.jump button { font-family: var(--mono); font-size: 12px; padding: 4px 9px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 999px; cursor: pointer }
.jump button[aria-pressed=true] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
section { margin-top: 30px }
section h2 { display: flex; align-items: baseline; gap: 12px; font-family: var(--display); font-weight: 700; font-size: 30px; text-transform: uppercase; margin: 0 0 10px; letter-spacing: .02em }
section h2 small { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0 }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px }
.show { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; min-width: 0 }
.show:hover { border-color: var(--signal) }
.show input { width: 17px; height: 17px; accent-color: var(--signal); margin: 0 }
.show .name { min-width: 0; overflow-wrap: anywhere; font-weight: 500 }
.show .yr { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.show .meta { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400 }
.show .meta .hot { color: var(--onair) }
.show.on { background: var(--signal-soft); border-color: var(--signal) }
.show.locked { cursor: default }
.extra { margin-top: 40px; padding-top: 20px; border-top: 2px solid var(--ink) }
.extra h2 { font-family: var(--display); font-size: 30px; text-transform: uppercase; margin: 0 0 6px }
.extra p { color: var(--muted); margin: 0 0 10px }
.extra textarea { width: 100%; box-sizing: border-box; min-height: 110px; font: inherit; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--ink) }
.empty { color: var(--muted); font-style: italic; padding: 20px 0 }
@media (prefers-reduced-motion: no-preference) { .show { transition: background .12s, border-color .12s } }
</style>

<div class="wrap">
  <header>
    <h1>Shows I've Watched</h1>

    <p>Type any other shows you've watched, one per line.</p>
    <textarea id="extra" placeholder="e.g. Mirzapur&#10;The Haunting of Bly Manor"></textarea>
  </div>
</div>

const keyOf = s => s.t + "|" + s.y;
const picked = new Set(SHOWS.filter(s => s.u).map(keyOf));
let filter = "all", query = "", ref = null, saveTimer = null, saving = Promise.resolve();
const $ = id => document.getElementById(id);
const status = (t, err) => { $("status").textContent = t; $("status").className = "status" + (err ? " err" : "") };

const decades = [...new Set(SHOWS.map(s => Math.floor(s.y / 10) * 10))].sort((a, b) => b - a);
const label = d => d < 1960 ? "Before 1960" : d + "s";
const bucket = s => Math.max(1950, Math.floor(s.y / 10) * 10);
const jumpOpts = [["all", "All"], ["ticked", "Ticked"], ...[...new Set(SHOWS.map(bucket))].sort((a, b) => b - a).map(d => [String(d), label(d)])];
$("jump").innerHTML = jumpOpts.map(([v, l]) => `<button type="button" data-f="${v}" aria-pressed="${v === filter}">${l}</button>`).join("");
$("jump").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  [...$("jump").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])) }

function render() {
  const q = query.trim().toLowerCase();
  const groups = {};
  for (const s of SHOWS) {
    if (q && !s.t.toLowerCase().includes(q)) continue;
    if (filter === "ticked" && !picked.has(keyOf(s))) continue;
    if (/^\d+$/.test(filter) && bucket(s) !== +filter) continue;
    (groups[bucket(s)] ||= []).push(s);
  }
  const ds = Object.keys(groups).map(Number).sort((a, b) => b - a);
  $("list").innerHTML = ds.length ? ds.map(d => `
    <section><h2>${label(d)} <small>${groups[d].length} shows</small></h2>
    <div class="grid">${groups[d].map(s => {
      const k = keyOf(s), on = picked.has(k);
      const meta = s.u ? "added" : s.n ? `on ${s.n} list${s.n > 1 ? "s" : ""}` : "popular";
      return `<label class="show${on ? " on" : ""}${s.u ? " locked" : ""}">
        <input type="checkbox" data-k="${esc(k)}" ${on ? "checked" : ""} ${s.u ? "disabled" : ""}>
        <span class="name">${esc(s.t)}<span class="meta">${s.n >= 4 ? `<span class="hot">${meta}</span>` : meta}</span></span>
        <span class="yr">${s.y}</span></label>`;
    }).join("")}</div></section>`).join("") : `<p class="empty">No shows match “${esc(query)}”. Add it in the box below.</p>`;
  $("n").textContent = picked.size;
}

$("list").addEventListener("change", e => {
  const k = e.target.dataset.k; if (!k) return;
  e.target.checked ? picked.add(k) : picked.delete(k);
  e.target.closest(".show").classList.toggle("on", e.target.checked);
  $("n").textContent = picked.size;
  queueSave();
});
$("q").addEventListener("input", e => { query = e.target.value; render() });
$("extra").addEventListener("input", queueSave);

function queueSave() {
  if (!ref) { status("Not saved: open this page signed in to claude.ai", true); return }
  status("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = { ticked: [...picked], extra: $("extra").value };
    saving = saving.then(() => ref.set(body)).then(() => status("Saved"), () => status("Couldn't save. Your ticks are still on screen; tick again to retry.", true));
  }, 700);
}

render();

(async () => {
  const timer = setTimeout(() => { if (!ref) status("Not connected: ticks won't save", true) }, 10000);
  const db = await window.claude?.use?.("db");
  if (!db) { clearTimeout(timer); status("Not connected: ticks won't save", true); return }
  try {
    const r = db.doc("picks/main");
    const snap = await r.get();
    clearTimeout(timer);
    if (snap.exists) {
      const d = snap.data();
      (d.ticked || []).forEach(k => picked.add(k));
      $("extra").value = d.extra || "";
      render();
    }
    ref = r;
    status(snap.exists ? "Saved" : "Ready");
  } catch (e) { clearTimeout(timer); status("Couldn't load saved picks", true) }
})();
</script>
